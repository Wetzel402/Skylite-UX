name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version for the image (e.g. 2026.2.2 or dev)"
        required: true
      target:
        description: "Build which images"
        type: choice
        options: [all, docker, ha_app]
        default: all
      bump_version:
        description: "Commit the version bump to main/dev after building"
        type: boolean
        default: false

jobs:
  build_docker:
    name: Push Docker image to Docker Hub
    if: inputs.target != 'ha_app'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set version from tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
        run: |
          if [[ "${TAG}" == "dev" ]]; then
            exit 0
          fi
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "Tag ${TAG} is not a valid YYYY.M.MICRO[bN] version" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = version;
            lock.packages[""].version = version;
            fs.writeFileSync("package-lock.json", `${JSON.stringify(lock, null, 2)}\n`);
          ' "${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to DHI.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ secrets.DOCKER_NAMESPACE }}/${{ secrets.DOCKER_REPOSITORY }}

      - name: Prepare tags
        id: tags
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        run: |
          TAGS="${{ secrets.DOCKER_NAMESPACE }}/${{ secrets.DOCKER_REPOSITORY }}:${TAG}"
          if [[ "${PRERELEASE}" == "true" ]] || [[ "${TAG}" == *"b"* ]]; then
            TAGS="${TAGS},${{ secrets.DOCKER_NAMESPACE }}/${{ secrets.DOCKER_REPOSITORY }}:beta"
          fi
          if [[ "${PRERELEASE}" != "true" ]] && [[ "${TAG}" != *"b"* ]] && [[ "${TAG}" != "dev" ]]; then
            TAGS="${TAGS},${{ secrets.DOCKER_NAMESPACE }}/${{ secrets.DOCKER_REPOSITORY }}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_NAMESPACE }}/${{ secrets.DOCKER_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build_ha_app:
    name: Push HA app image to Docker Hub
    if: inputs.target != 'docker'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set version from tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
        run: |
          if [[ "${TAG}" == "dev" ]]; then
            exit 0
          fi
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "Tag ${TAG} is not a valid YYYY.M.MICRO[bN] version" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = version;
            lock.packages[""].version = version;
            fs.writeFileSync("package-lock.json", `${JSON.stringify(lock, null, 2)}\n`);
          ' "${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to DHI.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha

      - name: Prepare tags
        id: tags
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || 'dev' }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        run: |
          VERSION="${TAG#v}"
          TAGS="${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha:${TAG}"
          if [[ "${VERSION}" != "${TAG}" ]]; then
            TAGS="${TAGS},${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha:${VERSION}"
          fi
          if [[ "${PRERELEASE}" == "true" ]] || [[ "${TAG}" == *"b"* ]]; then
            TAGS="${TAGS},${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha:beta"
          fi
          if [[ "${PRERELEASE}" != "true" ]] && [[ "${TAG}" != *"b"* ]] && [[ "${TAG}" != "dev" ]]; then
            TAGS="${TAGS},${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./ha-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_NAMESPACE }}/skylite-ux-ha
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  bump_version:
    name: Commit version bump to ${{ matrix.branch }}
    needs: [build_docker, build_ha_app]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'release' || inputs.bump_version) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Write version
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "Tag ${TAG} is not a valid YYYY.M.MICRO[bN] version" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          sort_key() {
            if [[ "$1" =~ ^(.+)b([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[1]}.0.${BASH_REMATCH[2]}"
            else
              echo "$1.1.0"
            fi
          }
          CURRENT=$(node -p 'require("./package.json").version')
          if [[ "${CURRENT}" != "${VERSION}" ]]; then
            NEWEST=$(printf '%s\n%s\n' "$(sort_key "${CURRENT}")" "$(sort_key "${VERSION}")" | sort -V | tail -n 1)
            if [[ "${NEWEST}" == "$(sort_key "${CURRENT}")" ]]; then
              echo "::notice::Skipping ${{ matrix.branch }}: already at ${CURRENT}, newer than ${VERSION}"
              exit 0
            fi
          fi
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = version;
            lock.packages[""].version = version;
            fs.writeFileSync("package-lock.json", `${JSON.stringify(lock, null, 2)}\n`);
          ' "${VERSION}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" ha-app/config.yaml
          if ! grep -qxF "version: ${VERSION}" ha-app/config.yaml; then
            echo "ha-app/config.yaml is missing a top-level 'version: ${VERSION}' line" >&2
            exit 1
          fi

      - name: Commit version bump
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${VERSION} [skip ci]"
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Push version bump
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          for i in 1 2 3; do
            git push origin "${BRANCH}" && exit 0
            git pull --rebase origin "${BRANCH}"
          done
          exit 1
